<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SquashCoach</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stats" href="materialize.css">
  <script type="module" src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>SquashCoach</h1>
    <button id="signInBtn" class="waves-effect waves-light btn">Sign In with Google</button>
    <span id="userName"></span>
  </header>

  <main>
    <section id="profile" class="hidden">
      <h2>Player Profile</h2>
      <label for="skillLevel">Select Skill Level:</label>
      <select id="skillLevel">
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>
    </section>

    <section id="matchTracker" class="hidden">
      <h2>Track Matches</h2>
      <form id="matchForm">
        <input type="text" id="opponent" placeholder="Opponent Name" required>
        <input type="number" id="yourScore" placeholder="Your Score" required>
        <input type="number" id="opponentScore" placeholder="Opponent Score" required>
        <input type="text" id="weakAreas" placeholder="Weak Areas (comma separated)">
        <button type="submit">Add Match</button>
      </form>

      <h3>Match History</h3>
      <ul id="matchList"></ul>

      <h3>Stats</h3>
      <p id="stats"></p>
    </section>

    <section id="drills" class="hidden">
      <h2>Recommended Drills & Tutorials</h2>
      <ul id="drillList"></ul>
    </section>
  </main>

  <!-- Firebase SDKs -->
  <script src="materialize.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyASWLSUE6DWMaQN7SpWBtCelDdVc30pTNM",
      authDomain: "squashcoach-f1cea.firebaseapp.com",
      projectId: "squashcoach-f1cea",
      storageBucket: "squashcoach-f1cea.firebasestorage.app",
      messagingSenderId: "917985213639",
      appId: "1:917985213639:web:574d81e63f35007a3b12e2"
    };

    export const app = initializeApp(firebaseConfig);
    export const auth = getAuth(app);
    export const db = getFirestore(app);
  </script>
</body>
</html>
