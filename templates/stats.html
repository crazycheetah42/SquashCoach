<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SquashCoach - Stats</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background-color: var(--bs-body-bg);
        color: var(--bs-body-color);
        transition: background-color 0.3s, color 0.3s;
    }
    .card {
        transition: background-color 0.3s, color 0.3s;
    }
    table.table {
        transition: background-color 0.3s, color 0.3s;
    }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary" id="mainNavbar">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">SquashCoach</a>
        <button class="navbar-toggler" type="button" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto" id="navLinks"></ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 class="text-center mb-4">Your Stats</h1>

    <div class="row text-center mb-5">
        <div class="col-md-4 mb-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Total Matches</h5>
                    <p id="totalMatches">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Matches Won</h5>
                    <p id="matchesWon">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Current Rating</h5>
                    <p id="currentRating">0</p>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-5">
        <div class="card-body">
            <h5 class="text-center">Rating Progression</h5>
            <canvas id="eloChart" height="100"></canvas>
        </div>
    </div>

    <div class="card shadow-sm mb-5">
        <div class="card-body">
            <h5 class="text-center">Recent Matches</h5>
            <div class="table-responsive">
                <table class="table table-striped" id="matchesTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Opponent</th>
                            <th>Score</th>
                            <th>Rating After Match</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1/dist/chartjs-adapter-luxon.min.js"></script>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyASWLSUE6DWMaQN7SpWBtCelDdVc30pTNM",
    authDomain: "squashcoach-f1cea.firebaseapp.com",
    projectId: "squashcoach-f1cea"
};

const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
const auth = getAuth(app);
const db = getFirestore(app);

const eloCtx = document.getElementById("eloChart").getContext("2d");
let eloChart;

const navLinks = document.getElementById("navLinks");
const navbarToggler = document.querySelector(".navbar-toggler");
const navbarCollapse = document.getElementById("navbarNav");

function renderNav(user) {
    if (!navLinks) return;

    if (user) {
        navLinks.innerHTML = `
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/matches">Log a Match</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="/stats">Stats</a></li>
            <li class="nav-item d-flex align-items-center">
                <span class="nav-link text-primary fw-bold">${user.displayName || user.email || "User"}</span>
            </li>
            <li class="nav-item d-flex align-items-center">
                <button class="btn btn-outline-danger btn-sm ms-2" id="logoutBtn">Logout</button>
            </li>
        `;

        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
            logoutBtn.addEventListener("click", async () => {
                await signOut(auth);
                window.location.href = "/login";
            });
        }
    } else {
        navLinks.innerHTML = `
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/login">Login / Register</a></li>
        `;
    }
}

// Mobile toggler
if (navbarToggler && navbarCollapse) {
    navbarToggler.addEventListener("click", () => {
        navbarCollapse.classList.toggle("show");
    });
}

onAuthStateChanged(auth, async user => {
    if (!user) return window.location.href = "/login";
    renderNav(user);

    const snapshot = await getDocs(query(collection(db, "matches"), orderBy("timestamp", "asc")));
    const matches = [];
    const eloProgression = [];

    snapshot.forEach(doc => {
        const data = doc.data();
        if (data.user_uid === user.uid) {
            matches.push(data);
            eloProgression.push({
                x: new Date(data.timestamp.seconds * 1000),
                y: ((data.new_elo - 1000)/200).toFixed(2)
            });
        }
    });

    // Total matches & wins
    document.getElementById("totalMatches").innerText = matches.length;
    const wins = matches.filter(m =>
        m.user_points.reduce((a,u,i)=>a + (u>m.opponent_points[i]?1:0),0)
        > m.user_points.length/2
    ).length;
    document.getElementById("matchesWon").innerText = wins;

    // Overall rating based on all matches
    let overallRating = 0;
    if (matches.length) {
        overallRating = matches.reduce((sum, m) => sum + ((m.new_elo - 1000)/200), 0) / matches.length;
    }
    document.getElementById("currentRating").innerText = overallRating.toFixed(2);

    // Populate table
    const tbody = document.querySelector("#matchesTable tbody");
    tbody.innerHTML = "";
    matches.slice(-10).reverse().forEach(m => {
        const tr = document.createElement("tr");
        const won = m.user_points.reduce((a,u,i)=>a+(u>m.opponent_points[i]?1:0),0);
        tr.innerHTML = `
            <td>${new Date(m.timestamp.seconds*1000).toLocaleDateString()}</td>
            <td>${m.opponent_name}</td>
            <td>${won}-${m.user_points.length-won}</td>
            <td>${((m.new_elo-1000)/200).toFixed(2)}</td>`;
        tbody.appendChild(tr);
    });

    // Chart
    function createChart(isDark) {
        const textColor = isDark ? "#e0e0e0" : "#000";
        const gridColor = isDark ? "rgba(224,224,224,0.1)" : "rgba(0,0,0,0.1)";

        if (eloChart) eloChart.destroy();

        eloChart = new Chart(eloCtx, {
            type: "line",
            data: {
                datasets: [{
                    label: "Rating",
                    data: eloProgression,
                    borderColor: "#4bc0c0",
                    backgroundColor: "rgba(75,192,192,0.2)",
                    tension: 0.2
                }]
            },
            options: {
                plugins: { legend: { labels: { color: textColor } } },
                scales: {
                    x: { type: "time", time: { unit: "day", displayFormats: { day: "MMM d" }, tooltipFormat: "MMM d, yyyy" }, ticks: { color: textColor }, grid: { color: gridColor } },
                    y: { ticks: { color: textColor }, grid: { color: gridColor }, min: 0 }
                }
            }
        });
    }

    // Dark mode
    function enableDark() {
        document.body.classList.add("bg-dark","text-light");
        document.querySelectorAll(".card").forEach(c => c.classList.add("bg-secondary","text-light"));
        document.querySelector("#mainNavbar").classList.replace("bg-body-tertiary","bg-dark");
        document.querySelector("#mainNavbar").classList.add("navbar-dark");
        document.querySelectorAll(".table").forEach(t => t.classList.add("table-dark"));
        createChart(true);
    }
    function disableDark() {
        document.body.classList.remove("bg-dark","text-light");
        document.querySelectorAll(".card").forEach(c => c.classList.remove("bg-secondary","text-light"));
        document.querySelector("#mainNavbar").classList.replace("bg-dark","bg-body-tertiary");
        document.querySelector("#mainNavbar").classList.remove("navbar-dark");
        document.querySelectorAll(".table").forEach(t => t.classList.remove("table-dark"));
        createChart(false);
    }

    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    mq.matches ? enableDark() : disableDark();
    mq.addEventListener("change", e => e.matches ? enableDark() : disableDark());
});
</script>
</body>
</html>
